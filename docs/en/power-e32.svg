<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 675" width="960" height="675" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <rect width="960" height="675" fill="#f7f4ee"/>
  <text x="480" y="44" text-anchor="middle" font-size="24" font-weight="bold" fill="#2b2a29">Single board: everyday power</text>
  <text x="480" y="72" text-anchor="middle" font-size="15" fill="#6b6560">5 V comes in through the case's USB-C and the board's UART connector. The board's own USB-C is only for the first flash.</text>

  <g font-size="15" text-anchor="middle">
    <rect x="20" y="130" width="110" height="90" rx="10" fill="#e6e0d6" stroke="#b9b1a4" stroke-width="2"/>
    <text x="75" y="170" font-weight="bold" fill="#2b2a29">Wall outlet</text>
    <text x="75" y="192" font-size="13" fill="#6b6560">110 / 220 V</text>

    <rect x="165" y="120" width="210" height="110" rx="10" fill="#fff" stroke="#e8743b" stroke-width="3"/>
    <text x="270" y="158" font-weight="bold" fill="#2b2a29">5 V USB supply</text>
    <text x="270" y="182" font-size="13" fill="#2b2a29">with a USB-A port</text>
    <text x="270" y="204" font-size="13" font-weight="bold" fill="#c4561f">at least 1 A</text>

    <rect x="530" y="125" width="130" height="100" rx="8" fill="#fff" stroke="#6b6560" stroke-width="2"/>
    <text x="595" y="160" font-weight="bold" fill="#2b2a29">USB-C female</text>
    <text x="595" y="180" font-size="13" fill="#2b2a29">breakout</text>
    <text x="595" y="202" font-size="12" fill="#b01e1e">(no resistors)</text>

    <rect x="700" y="100" width="240" height="250" rx="12" fill="#27313d"/>
    <rect x="740" y="150" width="160" height="110" rx="4" fill="#0f141a" stroke="#4a5868"/>
    <text x="820" y="212" font-weight="bold" fill="#e9edf2" font-size="18">E32R28T</text>
    <text x="820" y="128" font-size="12" fill="#ffd166">UART 4P 1.25</text>
    <text x="820" y="284" font-size="11" fill="#8a96a3">own USB-C: first flash only</text>
    <text x="760" y="336" font-size="11" fill="#b8c2cc">speaker 2P 1.25</text>
    <text x="882" y="336" font-size="11" fill="#b8c2cc">battery 2P 1.25</text>

    <rect x="700" y="385" width="115" height="70" rx="8" fill="#fff" stroke="#6b6560" stroke-width="2"/>
    <text x="757" y="415" font-weight="bold" fill="#2b2a29" font-size="13">8 Ω speaker</text>
    <text x="757" y="436" font-size="11" fill="#6b6560">optional</text>

    <rect x="825" y="385" width="115" height="70" rx="8" fill="#fff" stroke="#6b6560" stroke-width="2"/>
    <text x="882" y="408" font-weight="bold" fill="#2b2a29" font-size="13">LiPo 3.7 V</text>
    <text x="882" y="425" font-size="10" fill="#6b6560">with protection board</text>
    <text x="882" y="443" font-size="11" fill="#6b6560">optional</text>
  </g>

  <g stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="130" y1="175" x2="160" y2="175" stroke="#6b6560"/>
    <line x1="375" y1="175" x2="525" y2="175" stroke="#6b6560"/>
    <polyline points="660,165 690,165 690,118 705,118" stroke="#d62828"/>
    <polyline points="660,185 682,185 682,132 705,132" stroke="#2b2a29"/>
    <line x1="757" y1="350" x2="757" y2="383" stroke="#6b6560" stroke-width="4"/>
    <line x1="882" y1="350" x2="882" y2="383" stroke="#6b6560" stroke-width="4"/>
  </g>
  <polygon points="515,166 529,175 515,184" fill="#6b6560"/>
  <g font-size="12" fill="#6b6560" text-anchor="middle"><text x="452" y="142">USB-A → USB-C</text><text x="452" y="158">cable</text></g>
  <g font-size="12" text-anchor="middle">
    <text x="595" y="250" fill="#b01e1e">red: VBUS → pin 1 (+5 V)</text>
    <text x="595" y="268" fill="#2b2a29">black: GND → pin 2</text>
  </g>

  <rect x="30" y="480" width="900" height="175" rx="10" fill="#fff" stroke="#d9d2c6" stroke-width="2"/>
  <g font-size="14" fill="#2b2a29"><text x="55" y="517">• 5 V on the UART also charges the battery; unplug the supply and the board switches to the battery on its own.</text><text x="55" y="545">• The bare breakout has no CC resistors: a USB-C to USB-C charger won't power it, use a USB-A cable.</text><text x="55" y="573">• Pins 3 and 4 (TX, RX) stay unconnected and insulated. Measure with a multimeter before connecting.</text><text x="55" y="601">• Flash the firmware over the board's USB before assembling; after that, updates go over Wi-Fi.</text>
    <text x="55" y="637" font-weight="bold" fill="#b01e1e">• Never connect the UART power and the board's USB at the same time.</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <rect width="960" height="470" fill="#f7f4ee"/>
  <text x="480" y="44" text-anchor="middle" font-size="24" font-weight="bold" fill="#2b2a29">Alimentação: tudo entra pelo USB do ESP32</text>
  <text x="480" y="72" text-anchor="middle" font-size="15" fill="#6b6560">O ESP32 repassa os 5 V ao Nextion pelo pino 5V (fio vermelho).</text>

  <!-- caixas -->
  <g font-size="15" text-anchor="middle">
    <rect x="30" y="130" width="130" height="110" rx="10" fill="#e6e0d6" stroke="#b9b1a4" stroke-width="2"/>
    <text x="95" y="180" font-weight="bold" fill="#2b2a29">Tomada</text>
    <text x="95" y="202" font-size="13" fill="#6b6560">110 / 220 V</text>

    <rect x="215" y="120" width="190" height="130" rx="10" fill="#fff" stroke="#e8743b" stroke-width="3"/>
    <text x="310" y="160" font-weight="bold" fill="#2b2a29">Fonte USB 5 V</text>
    <text x="310" y="188" font-size="14" fill="#2b2a29">mínimo 1 A</text>
    <text x="310" y="210" font-size="14" font-weight="bold" fill="#c4561f">ideal 1,5 A ou mais</text>
    <text x="310" y="232" font-size="12" fill="#6b6560">(carregador comum)</text>

    <rect x="490" y="130" width="170" height="110" rx="12" fill="#27313d"/>
    <text x="575" y="178" font-weight="bold" fill="#e9edf2">ESP32-C3</text>
    <text x="575" y="200" font-size="13" fill="#b8c2cc">recebe e repassa</text>

    <rect x="745" y="120" width="180" height="130" rx="10" fill="#3a3a3a"/>
    <rect x="765" y="138" width="140" height="94" rx="4" fill="#f06a1e"/>
    <text x="835" y="182" font-weight="bold" fill="#2b1206">Nextion</text>
    <text x="835" y="202" font-size="12" fill="#5a2a08">pelo pino 5V</text>
  </g>

  <!-- ligacoes -->
  <g stroke-width="6" stroke-linecap="round">
    <line x1="160" y1="185" x2="210" y2="185" stroke="#6b6560"/>
    <line x1="405" y1="185" x2="485" y2="185" stroke="#6b6560"/>
    <line x1="660" y1="185" x2="740" y2="185" stroke="#d62828"/>
  </g>
  <polygon points="200,176 214,185 200,194" fill="#6b6560"/>
  <polygon points="475,176 489,185 475,194" fill="#6b6560"/>
  <polygon points="730,176 744,185 730,194" fill="#d62828"/>
  <g font-size="12" fill="#6b6560" text-anchor="middle">
    <text x="445" y="170">cabo USB-C</text>
    <text x="445" y="210">curto e bom</text>
    <text x="700" y="170" fill="#b01e1e">5V + GND</text>
  </g>

  <!-- avisos -->
  <rect x="30" y="285" width="900" height="150" rx="10" fill="#fff" stroke="#d9d2c6" stroke-width="2"/>
  <g font-size="15" fill="#2b2a29">
    <text x="55" y="320">• Juntos, ESP32 e Nextion passam de 500 mA nos picos do Wi-Fi.</text>
    <text x="55" y="348">• Fonte fraca não apaga nada: o Wi-Fi é que começa a perder pacotes.</text>
    <text x="55" y="376">• USB do computador (500 mA): serve para gravar e configurar, não para o dia a dia.</text>
    <text x="55" y="410" font-weight="bold" fill="#b01e1e">• Nunca ligue a fonte e o USB do computador ao mesmo tempo.</text>
  </g>
</svg>
